services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cmd_workspace
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      TZ: UTC
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d cmd_workspace']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cmd-workspace-postgres-m2:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-n', '1', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cmd-workspace-redis:/data

volumes:
  cmd-workspace-postgres-m2:
  cmd-workspace-redis:
